name: Send Bloom reminders

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  actions: write              # used by the keep-alive step below

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund --silent
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub pauses scheduled jobs after 60 days without commits. This keeps it running.
      - uses: liskin/gh-workflow-keepalive@v1

